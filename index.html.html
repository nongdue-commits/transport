<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบริหารงานขนส่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--pri:#1e3a8a;--acc:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',sans-serif;background:#f1f5f9;color:#1f2937;display:flex;min-height:100vh}
aside{width:235px;background:var(--pri);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-size:19px;padding:16px;margin:0;border-bottom:1px solid #fff3}
.grp{font-size:11px;opacity:.6;padding:12px 16px 4px;letter-spacing:.5px}
aside a{display:block;padding:8px 16px;color:#fff;cursor:pointer;font-size:14px}
aside a:hover{background:#fff2}
aside a.on{background:#fff;color:var(--pri);font-weight:600;border-radius:0 20px 20px 0;margin-right:10px}
.nb{float:right;background:#dc2626;color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.wrap{flex:1;min-width:0}
.top{background:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 3px #0001;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h2{margin:0;flex:1;font-size:20px}
main{padding:20px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
.card h3{margin:0 0 10px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001;border-top:4px solid var(--c)}
.kpi small{color:#6b7280}.kpi b{display:block;font-size:21px;margin-top:4px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.ch{height:260px;position:relative}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{font-size:13px;display:flex;flex-direction:column;gap:3px}
input,select,textarea{padding:7px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit;margin:2px;display:inline-block}
button.g{background:#64748b}button.r{background:#dc2626}button.ok{background:#16a34a}button.s{padding:3px 8px;font-size:13px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scroll{overflow:auto;max-height:600px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #e5e7eb;padding:6px;text-align:left;white-space:nowrap}
th{background:#f8fafc;position:sticky;top:0;z-index:1}
td input,td select{border:1px solid transparent;padding:3px;width:100%;min-width:90px;background:transparent}
td input:focus,td select:focus{border-color:var(--acc);background:#fff}
td input:disabled,td select:disabled{color:#475569}
.num{text-align:right}
.note{white-space:pre-wrap;min-width:200px;max-width:320px;font-size:12px;color:#6b7280}
.badge{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.b-red{background:#dc2626}.b-yel{background:#d97706}.b-grn{background:#16a34a}
.alert{padding:8px 12px;border-radius:8px;margin:4px 0;background:#fef3c7;font-size:14px}
.alert.red{background:#fee2e2}
.hint{color:#6b7280;font-size:13px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{flex:1;min-width:150px;padding:10px;border-radius:10px;background:#f8fafc;border:2px solid #e5e7eb;cursor:pointer}
.step.done{border-color:#16a34a;background:#f0fdf4}
.menu-btn{display:none}
@media(max-width:800px){aside{position:fixed;left:-240px;z-index:20;transition:.2s}aside.show{left:0}.menu-btn{display:inline-block}main{padding:10px}}
</style>
</head>
<body>
<aside id="side"><h1>🚚 ระบบขนส่ง</h1><nav id="nav"></nav></aside>
<div class="wrap">
 <div class="top">
  <button class="menu-btn" onclick="$('#side').classList.toggle('show')">☰</button>
  <h2 id="title"></h2>
  <label style="flex-direction:row;align-items:center;gap:6px">งวดเดือน <input type="month" id="month" onchange="month=this.value||today.slice(0,7);render()"></label>
  <button onclick="exportAll()">📥 Excel ทั้งเดือน</button>
 </div>
 <main id="main"></main>
</div>
<script>
// ================= ตัวช่วยทั่วไป =================
const $=s=>document.querySelector(s);
const D=s=>{const[a,b,c]=String(s).split('-');return new Date(+a,+b-1,+(c||1))};
const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const today=ymd(new Date());
const addDays=(s,n)=>{const x=D(s);x.setDate(x.getDate()+n);return ymd(x)};
const daysTo=s=>Math.round((D(s)-D(today))/864e5);
const fmt=n=>(+n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((+n||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const groupBy=(a,f)=>a.reduce((o,x)=>((o[f(x)||'-']??=[]).push(x),o),{});
const thDate=s=>s?D(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}):'-';
const thMonth=(m,short)=>D(m).toLocaleDateString('th-TH',{month:short?'short':'long',year:short?'2-digit':'numeric'});
const kpi=(l,v,c='#2563eb')=>`<div class="kpi" style="--c:${c}"><small>${l}</small><b>${v}</b></div>`;
const tbl=(h,rows,ints=[1])=>`<div class="scroll"><table><tr>${h.map((x,i)=>`<th class="${i?'num':''}">${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'num':''}">${typeof c==='number'&&!ints.includes(i)?fmt(c):esc(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="hint">ไม่มีข้อมูล</td></tr>`}</table></div>`;
function bahtText(n){
 n=r2(n);if(!n)return'ศูนย์บาทถ้วน';
 const W=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
 const rd=s=>{s=String(+s);let o='';const L=s.length;for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;
  o+=(p===0&&d===1&&L>1)?'เอ็ด':(p===1&&d===2)?'ยี่':(p===1&&d===1)?'':W[d];o+=P[p]}return o};
 const big=s=>s.length>6?big(s.slice(0,-6))+'ล้าน'+rd(s.slice(-6)):rd(s);
 const[b,st]=n.toFixed(2).split('.');
 return(+b?big(b)+'บาท':'')+(+st?rd(st)+'สตางค์':'ถ้วน');
}

// ================= ฐานข้อมูล (เก็บในเบราว์เซอร์) =================
const DEF={settings:{company:'',taxid:'',address:'',phone:'',bank:'',wht:1,vat:0,sso:5,ssoCap:875},
 customers:[],drivers:[],vehicles:[],rates:[],trips:[],expenses:[],invoices:[],skipped:[],payroll:{},ignored:[]};
let db,page='dash',month=today.slice(0,7),charts=[],lastLog='';
const save=()=>localStorage.setItem('tms_db',JSON.stringify(db));

const SCHEMA={
 trips:{title:'เที่ยววิ่ง',monthly:true,calc:true,cols:[['date','วันที่','date'],['driver','คนขับ','sel:drivers'],['plate','ทะเบียน','sel:vehicles'],['customer','ลูกค้า','sel:customers'],['origin','ต้นทาง'],['destination','ปลายทาง'],['trips','เที่ยว','number'],['status','สถานะ','opt:รอตรวจ|อนุมัติ']]},
 expenses:{title:'ค่าใช้จ่าย',monthly:true,cols:[['date','วันที่','date'],['driver','คนขับ','sel:drivers'],['plate','ทะเบียน','sel:vehicles'],['category','ประเภท','opt:น้ำมัน|ทางด่วน|ซ่อมบำรุง|ยาง|ค่าลง/ค่าแรง|เบี้ยเลี้ยง|อื่นๆ'],['amount','จำนวนเงิน','number'],['payBy','ผู้จ่าย','opt:บริษัท|คนขับสำรองจ่าย'],['memo','หมายเหตุ']]},
 customers:{title:'ลูกค้า',cols:[['name','ชื่อลูกค้า'],['taxid','เลขผู้เสียภาษี'],['branch','สาขา'],['address','ที่อยู่'],['phone','โทร'],['credit','เครดิต (วัน)','number'],['wht','หัก ณ ที่จ่าย %','number']],blank:{credit:30,wht:1,branch:'สำนักงานใหญ่'}},
 drivers:{title:'คนขับ',cols:[['name','ชื่อ-สกุล'],['lineName','ชื่อในไลน์'],['phone','โทร'],['idcard','เลขบัตร ปชช.'],['salary','เงินเดือนฐาน','number'],['bank','บัญชีธนาคาร'],['license','ใบขับขี่หมดอายุ','date']]},
 vehicles:{title:'รถ',cols:[['plate','ทะเบียน'],['type','ประเภทรถ'],['driver','คนขับประจำ','sel:drivers'],['taxExp','ภาษีรถหมดอายุ','date'],['insExp','ประกันหมดอายุ','date'],['actExp','พ.ร.บ.หมดอายุ','date'],['serviceKm','เช็กระยะถัดไป (กม.)','number']]},
 rates:{title:'เรทราคา',cols:[['customer','ลูกค้า','sel:customers'],['origin','ต้นทาง'],['destination','ปลายทาง'],['price','ราคาเก็บลูกค้า/เที่ยว','number'],['pay','ค่าเที่ยวคนขับ/เที่ยว','number']]}
};
const HELP={
 trips:'<p class="hint">💡 ราคาคำนวณจากเมนู "เรทราคา" อัตโนมัติ · ต้องเปลี่ยนสถานะเป็น "อนุมัติ" ก่อนจึงจะวางบิลได้ · เที่ยวที่วางบิลแล้วจะถูกล็อก 🔒</p>',
 expenses:'<p class="hint">💡 รายการที่เลือก "คนขับสำรองจ่าย" ระบบจะบวกคืนให้คนขับในหน้าค่าจ้างอัตโนมัติ</p>',
 drivers:'<p class="hint">💡 "ชื่อในไลน์" ใช้จับคู่ตอนนำเข้าแชท ต้องตรงกับชื่อที่แสดงในกลุ่มไลน์</p>',
 vehicles:'<p class="hint">💡 ระบบจะแจ้งเตือนที่หน้าแดชบอร์ดเมื่อภาษี ประกัน หรือ พ.ร.บ. ใกล้หมดอายุภายใน 30 วัน</p>',
 rates:'<p class="hint">💡 ระบบจับคู่ด้วยต้นทาง + ปลายทาง (+ ลูกค้า) ถ้าเส้นทางเดียวกันแต่ราคาต่างกันตามลูกค้า ให้เพิ่มคนละแถว</p>',
 customers:'<p class="hint">💡 เครดิต (วัน) ใช้คำนวณวันครบกำหนดชำระ ข้อมูลในหน้านี้จะแสดงบนใบวางบิลและใบเสร็จ</p>'
};
const rateOf=t=>db.rates.find(r=>r.origin===t.origin&&r.destination===t.destination&&(!t.customer||!r.customer||r.customer===t.customer));
function calc(t){const r=rateOf(t)||{},n=+t.trips||0;return{...t,customer:t.customer||r.customer||'',unit:+r.price||0,price:(+r.price||0)*n,pay:(+r.pay||0)*n}}
const MT=()=>db.trips.filter(t=>(t.date||'').startsWith(month)).map(calc);
const ME=()=>db.expenses.filter(e=>(e.date||'').startsWith(month));

// ================= เมนูและการแสดงผล =================
const MENU=[['ภาพรวม',[['dash','📊','แดชบอร์ด']]],
 ['งานประจำวัน',[['import','📥','นำเข้าแชทไลน์'],['trips','🚚','เที่ยววิ่ง'],['expenses','⛽','ค่าใช้จ่าย']]],
 ['การเงิน',[['billing','🧾','วางบิล & รับชำระ'],['payroll','👷','ค่าจ้าง & เงินเดือน'],['wht','📑','หัก ณ ที่จ่าย']]],
 ['ข้อมูลหลัก',[['customers','🏢','ลูกค้า'],['drivers','🧑‍✈️','คนขับ'],['vehicles','🚛','รถ'],['rates','💰','เรทราคา']]],
 ['รายงาน',[['reports','📈','รายงานวิเคราะห์']]],
 ['ระบบ',[['settings','⚙️','ตั้งค่า & สำรองข้อมูล']]]];
const PAGES={dash:pDash,import:pImport,billing:pBilling,payroll:pPayroll,wht:pWht,reports:pReports,settings:pSettings};
function go(p){page=p;render();scrollTo(0,0)}
function render(){
 const nb={trips:db.trips.filter(t=>t.status!=='อนุมัติ').length,billing:db.invoices.filter(v=>v.status!=='ชำระแล้ว'&&daysTo(v.due)<0).length,import:db.skipped.length};
 $('#nav').innerHTML=MENU.map(([g,it])=>`<div class="grp">${g}</div>`+it.map(([k,ic,t])=>`<a class="${k===page?'on':''}" onclick="go('${k}')">${ic} ${t}${nb[k]?`<span class="nb">${nb[k]}</span>`:''}</a>`).join('')).join('');
 const m=MENU.flatMap(g=>g[1]).find(x=>x[0]===page);$('#title').textContent=m[1]+' '+m[2];
 $('#month').value=month;
 charts.forEach(c=>c.destroy());charts=[];
 $('#main').innerHTML=(PAGES[page]||(()=>crud(page)))();
 if(page==='dash')drawDash();if(page==='reports')drawRep();
 $('#side').classList.remove('show');
}
const PAL=['#2563eb','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#64748b'];
function mk(id,type,labels,datasets,opt={}){const el=document.getElementById(id);if(!el)return;
 charts.push(new Chart(el,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='doughnut'||datasets.length>1}},...opt}}))}

// ================= 📊 แดชบอร์ด =================
function alerts(){
 const a=[];
 db.vehicles.forEach(v=>[['taxExp','ภาษีรถ'],['insExp','ประกัน'],['actExp','พ.ร.บ.']].forEach(([k,l])=>{if(!v[k])return;const d=daysTo(v[k]);
  if(d<=30)a.push([d<0?'red':'',`🚛 ${esc(v.plate)}: ${l} ${d<0?'หมดอายุแล้ว '+(-d)+' วัน':'จะหมดอายุใน '+d+' วัน'} (${thDate(v[k])})`])}));
 db.drivers.forEach(x=>{if(!x.license)return;const d=daysTo(x.license);if(d<=30)a.push([d<0?'red':'',`🧑‍✈️ ${esc(x.name)}: ใบขับขี่${d<0?'หมดอายุแล้ว':' จะหมดอายุใน '+d+' วัน'}`])});
 db.invoices.forEach(v=>{if(v.status!=='ชำระแล้ว'&&daysTo(v.due)<0)a.push(['red',`🧾 ${v.no} ${esc(v.customer)} เกินกำหนดชำระ ${-daysTo(v.due)} วัน (${fmt(v.net)} บาท)`])});
 const T=MT(),nr=T.filter(t=>!t.unit).length,pd=T.filter(t=>t.status!=='อนุมัติ').length;
 if(nr)a.push(['',`💰 มี ${nr} เที่ยวที่ยังไม่มีเรทราคา`]);
 if(pd)a.push(['',`✔ มี ${pd} เที่ยวรอตรวจและอนุมัติ`]);
 if(db.skipped.length)a.push(['',`❓ มี ${db.skipped.length} ข้อความจากไลน์ที่ระบบอ่านไม่ออก`]);
 return a;
}
function pDash(){
 const T=MT(),E=ME(),rev=sum(T,t=>t.price),pay=sum(T,t=>t.pay),exp=sum(E,e=>e.amount);
 const unpaid=db.invoices.filter(v=>v.status!=='ชำระแล้ว'),pend=T.filter(t=>t.status!=='อนุมัติ').length,unb=T.filter(t=>!t.invoiceNo).length;
 const inv=db.invoices.filter(v=>v.period===month),paidN=inv.filter(v=>v.status==='ชำระแล้ว').length,pd=!!db.payroll['paid|'+month];
 const steps=[['📥','นำเข้าข้อมูล',T.length>0,`${T.length} รายการ`,'import'],['✔','ตรวจ & อนุมัติ',T.length&&!pend,`รอตรวจ ${pend} เที่ยว`,'trips'],
  ['🧾','วางบิล',T.length&&!unb,`ค้างวางบิล ${unb} เที่ยว`,'billing'],['💵','รับชำระ',inv.length&&paidN===inv.length,`รับแล้ว ${paidN}/${inv.length} ใบ`,'billing'],
  ['👷','จ่ายค่าจ้าง',pd,pd?'ปิดงวดแล้ว':'ยังไม่ปิดงวด','payroll']];
 const al=alerts();
 return `<div class="kpis">${kpi('จำนวนเที่ยว',sum(T,t=>t.trips))}${kpi('รายได้ค่าขนส่ง',fmt(rev),'#16a34a')}${kpi('ค่าเที่ยวคนขับ',fmt(pay),'#d97706')}${kpi('ค่าใช้จ่ายรถ',fmt(exp),'#dc2626')}${kpi('กำไรขั้นต้น',fmt(rev-pay-exp),'#7c3aed')}${kpi('ลูกหนี้ค้างชำระ',fmt(sum(unpaid,v=>v.net)),'#0891b2')}</div>
 <div class="card"><h3>🔄 ขั้นตอนงานประจำเดือน ${thMonth(month)}</h3><div class="steps">${steps.map(([ic,t,ok,d,p],i)=>`<div class="step ${ok?'done':''}" onclick="go('${p}')"><b>${i+1}. ${ic} ${t}</b><br><small>${ok?'✅ ':''}${d}</small></div>`).join('')}</div></div>
 <div class="g2">
  <div class="card"><h3>📅 รายได้รายวัน</h3><div class="ch"><canvas id="c1"></canvas></div></div>
  <div class="card"><h3>🔔 แจ้งเตือน (${al.length})</h3><div style="max-height:260px;overflow:auto">${al.length?al.map(([c,t])=>`<div class="alert ${c}">${t}</div>`).join(''):'<p class="hint">ไม่มีเรื่องต้องจัดการ 🎉</p>'}</div></div>
  <div class="card"><h3>⛽ ค่าใช้จ่ายตามประเภท</h3><div class="ch"><canvas id="c2"></canvas></div></div>
  <div class="card"><h3>🏢 รายได้ตามลูกค้า</h3><div class="ch"><canvas id="c3"></canvas></div></div>
  <div class="card"><h3>🚛 จำนวนเที่ยวตามรถ</h3><div class="ch"><canvas id="c4"></canvas></div></div>
 </div>`;
}
function drawDash(){
 const T=MT(),E=ME(),n=new Date(+month.slice(0,4),+month.slice(5,7),0).getDate(),days=[...Array(n)].map((_,i)=>i+1);
 mk('c1','bar',days,[{label:'รายได้',data:days.map(d=>sum(T.filter(t=>+t.date.slice(8)===d),t=>t.price)),backgroundColor:'#2563eb'}]);
 const ec=groupBy(E,e=>e.category);mk('c2','doughnut',Object.keys(ec),[{data:Object.values(ec).map(a=>sum(a,e=>e.amount)),backgroundColor:PAL}]);
 const cc=groupBy(T,t=>t.customer||'ไม่ระบุ');mk('c3','bar',Object.keys(cc),[{label:'รายได้',data:Object.values(cc).map(a=>sum(a,t=>t.price)),backgroundColor:'#16a34a'}],{indexAxis:'y'});
 const vc=groupBy(T,t=>t.plate);mk('c4','bar',Object.keys(vc),[{label:'เที่ยว',data:Object.values(vc).map(a=>sum(a,t=>t.trips)),backgroundColor:'#d97706'}]);
}

// ================= 📥 นำเข้าแชทไลน์ =================
const ALIAS={'กทม':'กรุงเทพ','กทม.':'กรุงเทพ','กรุงเทพฯ':'กรุงเทพ','บางกอก':'กรุงเทพ','ชบ':'ชลบุรี','รย':'ระยอง'};
const EXP=[['น้ำมัน',/น้ำมัน|เติม|ดีเซล|โซล่า/],['ทางด่วน',/ทางด่วน|มอเตอร์เวย์/],['ยาง',/ยาง/],['ซ่อมบำรุง',/ซ่อม|อะไหล่/],['ค่าลง/ค่าแรง',/ค่าลง|ค่าแรงลง|ค่ายก/],['อื่นๆ',/ค่าจอด|ค่าชั่ง|ค่าผ่าน/]];
const PLATE=/(?:^|[\s:,(]|ทะเบียน)(\d?[ก-ฮ]{1,2}\s?-?\d{1,4}|\d{2}-\d{4})(?=$|[\s,)])/;
const ROUTE=/([ก-๙a-zA-Z.]{2,})\s*(?:->|-|–|>)\s*([ก-๙a-zA-Z.]{2,})/;
const norm=p=>{p=p.trim().replace(/^(วิ่ง|จาก|ไป|ส่ง)/,'');return ALIAS[p]||p};
function parseDate(s){
 let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/),d,mo,y;
 if(m){d=+m[1];mo=+m[2];y=+m[3]}
 else if(m=s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
 else return null;
 if(y>2400)y-=543;
 return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function parseChat(txt){
 const msgs=[];let date=null;
 for(const raw of txt.replace(/\r/g,'').split('\n')){
  const line=raw.trim();if(!line)continue;
  const m=raw.match(/^(\d{1,2}:\d{2})[^\t]*\t([^\t]*)\t(.*)$/)||line.match(/^(\d{1,2}:\d{2})\s+(\S+)\s+(.+)$/);
  if(m&&date){msgs.push({date,time:m[1],name:m[2].trim(),text:m[3].replace(/^"|"$/g,'')});continue}
  const d=line.length<45&&parseDate(line);
  if(d){date=d;continue}
  if(msgs.length)msgs[msgs.length-1].text+='\n'+line.replace(/"$/,'');
 }
 return msgs;
}
function extract(m){
 const t=m.text.replace(/\n/g,' '),out=[],pm=t.match(PLATE),plate=pm?pm[1].replace(/\s/g,''):'';
 const rest=pm?t.replace(pm[1],' '):t,base={date:m.date,driver:m.name,plate,note:m.text};
 const ek=EXP.find(([,re])=>re.test(t)),r=rest.match(ROUTE);
 if(r&&(!ek||/เที่ยว/.test(t))){const tc=rest.match(/(\d+)\s*เที่ยว/);out.push(['trips',{...base,customer:'',origin:norm(r[1]),destination:norm(r[2]),trips:tc?+tc[1]:1,status:'รอตรวจ'}])}
 if(ek){const nums=(rest.replace(/\d+\s*เที่ยว/g,'').match(/\d[\d,]*(?:\.\d+)?/g)||[]).map(n=>+n.replace(/,/g,'')).filter(n=>n>=10);
  if(nums.length)out.push(['expenses',{...base,category:ek[0],amount:Math.max(...nums),payBy:'คนขับสำรองจ่าย',memo:''}])}
 return out;
}
function importMsgs(msgs){
 const seen=new Set([...db.trips,...db.expenses,...db.skipped].map(x=>x.src).filter(Boolean).concat(db.ignored));
 let nt=0,ne=0,ns=0,dup=0,last='';
 msgs.forEach(m=>{
  const src=[m.date,m.time,m.name,m.text].join('|');if(seen.has(src)){dup++;return}seen.add(src);
  const drv=(db.drivers.find(d=>d.lineName&&d.lineName===m.name)||db.drivers.find(d=>d.name===m.name))?.name||m.name;
  const res=extract({...m,name:drv});
  res.forEach(([k,row])=>{
   if(!row.plate&&row.driver)row.plate=db.vehicles.find(v=>v.driver===row.driver)?.plate||'';
   if(!row.driver&&row.plate)row.driver=db.vehicles.find(v=>v.plate===row.plate)?.driver||'';
   db[k].push({id:uid(),src,...row});k==='trips'?nt++:ne++;last=row.date});
  if(!res.length&&/เที่ยว|ทะเบียน|\d{3,}/.test(m.text)){db.skipped.push({src,date:m.date,driver:drv,text:m.text});ns++}
 });
 lastLog=`✅ อ่าน ${msgs.length} ข้อความ → เที่ยววิ่งใหม่ <b>${nt}</b> · ค่าใช้จ่ายใหม่ <b>${ne}</b> · อ่านไม่ออก <b>${ns}</b> · ซ้ำ/ข้าม ${dup}`;
 if(last)month=last.slice(0,7);save();render();
}
async function importFiles(inp){let msgs=[];for(const f of inp.files)msgs.push(...parseChat(await f.text()));inp.value='';
 if(!msgs.length)return alert('อ่านไฟล์ไม่ได้ค่ะ ลองส่งตัวอย่างไฟล์ให้ผู้ช่วยปรับโค้ดนะคะ');importMsgs(msgs)}
function importText(){const txt=$('#chatText').value;if(!txt.trim())return;let msgs=parseChat(txt);
 if(!msgs.length)msgs=txt.split('\n').map(l=>l.trim()).filter(Boolean).map((text,k)=>({date:today,time:'#'+k,name:'',text}));importMsgs(msgs)}
function toTrip(i){const s=db.skipped.splice(i,1)[0];db.trips.push({id:uid(),src:s.src,date:s.date,driver:s.driver,plate:'',customer:'',origin:'',destination:'',trips:1,status:'รอตรวจ',note:s.text});save();month=s.date.slice(0,7);go('trips')}

const optsOf=t=>t.startsWith('sel:')?db[t.slice(4)].map(x=>x.name||x.plate):t.slice(4).split('|');
function cell(key,i,r,[k,,t=''],lock,c){
 const on=`${lock?'disabled':''} onchange="upd('${key}',${i},'${k}',this.value,'${t}')"`,v=r[k]??'';
 if(t.startsWith('sel:')||t.startsWith('opt:')){
  const o=[...new Set([...optsOf(t),v].filter(x=>x!==''))];
  const first=key==='trips'&&k==='customer'&&!v&&c?.customer?`(อัตโนมัติ: ${c.customer})`:'';
  return `<td><select ${on}><option value="">${esc(first)}</option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></td>`;
 }
 return `<td><input type="${t||'text'}" value="${esc(v)}" ${on}></td>`;
}
function crud(key){
 const S=SCHEMA[key];
 const rows=db[key].map((r,i)=>[r,i]).filter(([r])=>!S.monthly||(r.date||'').startsWith(month));
 if(S.monthly)rows.sort((a,b)=>(a[0].date||'').localeCompare(b[0].date||''));
 let h=`<div class="card"><div class="bar">
  <button onclick="addRow('${key}')">+ เพิ่ม${S.title}</button>
  <input placeholder="🔍 ค้นหา..." oninput="filt(this.value)" style="max-width:240px">
  <button class="g" onclick="xlsOne('${key}')">📥 Excel</button>
  ${key==='rates'?'<button class="g" onclick="addMissingRates()">+ ดึงเส้นทางที่ยังไม่มีเรท</button>':''}
  ${key==='trips'?'<button class="ok" onclick="approveAll()">✔ อนุมัติทั้งหมดของเดือนนี้</button>':''}
  <span class="hint">${rows.length} รายการ${S.monthly?' · '+thMonth(month):''}</span></div>
  <div class="scroll" style="margin-top:10px"><table id="tb"><tr>${S.cols.map(c=>`<th>${c[1]}</th>`).join('')}${S.calc?'<th class="num">ราคา/เที่ยว</th><th class="num">ค่าเที่ยวลูกค้า</th><th class="num">ค่าจ้างคนขับ</th><th>บิล</th>':''}${S.monthly?'<th>ข้อความต้นฉบับ</th>':''}<th></th></tr>`;
 rows.forEach(([r,i])=>{
  const c=S.calc?calc(r):null,lock=!!r.invoiceNo;
  h+=`<tr id="r${i}" data-q="${esc(JSON.stringify(r).toLowerCase())}">`+S.cols.map(col=>cell(key,i,r,col,lock,c)).join('');
  if(S.calc)h+=`<td class="num cu">${fmt(c.unit)}</td><td class="num cp">${fmt(c.price)}</td><td class="num cq">${fmt(c.pay)}</td><td>${lock?`<span class="badge b-grn">${r.invoiceNo}</span>`:''}</td>`;
  if(S.monthly)h+=`<td class="note">${esc(r.note||'')}</td>`;
  h+=`<td>${lock?'🔒':`<button class="s r" onclick="delRow('${key}',${i})">ลบ</button>`}</td></tr>`;
 });
 return h+'</table></div></div>'+(HELP[key]||'');
}
function filt(q){q=q.toLowerCase();document.querySelectorAll('#tb tr[data-q]').forEach(tr=>tr.style.display=tr.dataset.q.includes(q)?'':'none')}
function upd(key,i,k,v,t){const r=db[key][i];r[k]=t==='number'?+v:v;save();
 if(key==='trips'){const c=calc(r),tr=$('#r'+i);tr.querySelector('.cu').textContent=fmt(c.unit);tr.querySelector('.cp').textContent=fmt(c.price);tr.querySelector('.cq').textContent=fmt(c.pay)}}
function addRow(key){const S=SCHEMA[key],r={id:uid(),...(S.blank||{})};
 if(S.monthly)r.date=month===today.slice(0,7)?today:month+'-01';
 if(key==='trips')Object.assign(r,{trips:1,status:'รอตรวจ',note:'เพิ่มเอง'});
 if(key==='expenses')Object.assign(r,{category:'น้ำมัน',payBy:'บริษัท',note:'เพิ่มเอง'});
 db[key].unshift(r);save();render()}
function delRow(key,i){const r=db[key][i];if(r.invoiceNo||!confirm('ลบรายการนี้?'))return;if(r.src)db.ignored.push(r.src);db[key].splice(i,1);save();render()}

function addMissingRates(){const k=new Set(db.rates.map(r=>r.origin+'|'+r.destination));let n=0;
 db.trips.forEach(t=>{const x=t.origin+'|'+t.destination;if(t.origin&&t.destination&&!k.has(x)){k.add(x);n++;db.rates.push({id:uid(),customer:t.customer||'',origin:t.origin,destination:t.destination,price:0,pay:0})}});
 save();render();alert(n?`เพิ่ม ${n} เส้นทาง กรุณาใส่ราคาด้วยนะคะ`:'ทุกเส้นทางมีเรทแล้วค่ะ')}

function nextNo(p,date){const pre=p+date.slice(0,7).replace('-','')+'-';
 const n=db.invoices.flatMap(v=>[v.no,v.rcNo]).filter(x=>x&&x.startsWith(pre)).map(x=>+x.split('-')[1]);
 return pre+String(Math.max(0,...n)+1).padStart(3,'0')}
function makeInvoice(c,m,date=today){
 const T=db.trips.filter(t=>(t.date||'').startsWith(m)&&!t.invoiceNo&&t.status==='อนุมัติ').map(calc).filter(t=>(t.customer||'ไม่ระบุลูกค้า')===c).sort((a,b)=>a.date.localeCompare(b.date));
 if(!T.length)return null;
 const cu=db.customers.find(x=>x.name===c)||{},s=db.settings,wr=cu.wht===undefined||cu.wht===''?+s.wht:+cu.wht;
 const sub=r2(sum(T,t=>t.price)),vat=r2(sub*(+s.vat||0)/100),wht=r2(sub*wr/100),no=nextNo('INV',date),ids=new Set(T.map(t=>t.id));
 db.trips.forEach(t=>{if(ids.has(t.id))t.invoiceNo=no});
 const v={id:uid(),no,date,customer:c,period:m,items:T.map(t=>({id:t.id,date:t.date,plate:t.plate,origin:t.origin,destination:t.destination,trips:+t.trips,unit:t.unit,price:t.price})),
  sub,vatRate:+s.vat||0,vat,whtRate:wr,wht,net:r2(sub+vat-wht),due:addDays(date,+cu.credit||30),status:'ค้างชำระ',cert:false};
 db.invoices.push(v);return v;
}

 v.status='ชำระแล้ว';v.paidDate=d;v.rcNo=nextNo('RC',d);save();render()}

function payRows(){
 const T=MT(),E=ME(),s=db.settings;
 const names=[...new Set([...db.drivers.map(d=>d.name),...T.map(t=>t.driver),...E.map(e=>e.driver)].filter(Boolean))];
 return names.map(n=>{const d=db.drivers.find(x=>x.name===n)||{},a=db.payroll[month+'|'+n]||{},tt=T.filter(t=>t.driver===n);
  const salary=+d.salary||0,trip=sum(tt,t=>t.pay),reimb=sum(E.filter(e=>e.driver===n&&e.payBy==='คนขับสำรองจ่าย'),e=>e.amount);
  const bonus=+a.bonus||0,gross=salary+trip+bonus,sso=r2(Math.min(gross*(+s.sso||0)/100,+s.ssoCap||0)),tax=+a.tax||0,adv=+a.advance||0,ded=+a.deduct||0;
  return{name:n,bank:d.bank||'',trips:sum(tt,t=>t.trips),salary,trip,bonus,gross,reimb,sso,tax,adv,ded,net:r2(gross+reimb-sso-tax-adv-ded)}});
}

function repData(){
 const T=MT(),E=ME();
 const plates=[...new Set([...db.vehicles.map(v=>v.plate),...T.map(t=>t.plate),...E.map(e=>e.plate)].filter(Boolean))];
 const V=plates.map(p=>{const t=T.filter(x=>x.plate===p),e=E.filter(x=>x.plate===p),rev=sum(t,x=>x.price),pay=sum(t,x=>x.pay),ex=sum(e,x=>x.amount);
  return[p,sum(t,x=>x.trips),rev,pay,ex,rev-pay-ex,rev?((rev-pay-ex)/rev*100).toFixed(1)+'%':'-']});
 const C=Object.entries(groupBy(T,t=>t.customer||'ไม่ระบุลูกค้า')).map(([c,t])=>[c,sum(t,x=>x.trips),sum(t,x=>x.price),sum(db.invoices.filter(v=>v.customer===c&&v.status!=='ชำระแล้ว'),v=>v.net)]);
 const Dr=Object.entries(groupBy(T,t=>t.driver)).map(([d,t])=>[d,sum(t,x=>x.trips),sum(t,x=>x.price),sum(t,x=>x.pay),sum(E.filter(e=>e.driver===d),e=>e.amount)]);
 return{V,C,Dr};
}

 const rev=sum(T,t=>t.price),pay=sum(T,t=>t.pay),exp=sum(E,e=>e.amount);
 add('สรุป',XLSX.utils.aoa_to_sheet([['สรุปประจำเดือน',thMonth(month)],['จำนวนเที่ยว',sum(T,t=>t.trips)],['รายได้',rev],['ค่าเที่ยวคนขับ',pay],['ค่าใช้จ่ายรถ',exp],['กำไรขั้นต้น',rev-pay-exp]]));
 add('เที่ยววิ่ง',js(T.map(tripJson)));add('ค่าใช้จ่าย',js(E.map(expJson)));add('ค่าจ้าง',js(payJson()));
 add('ใบวางบิล',js(db.invoices.filter(v=>v.period===month).map(v=>({'เลขที่':v.no,'วันที่':v.date,'ลูกค้า':v.customer,'ยอดก่อนหัก':v.sub,'VAT':v.vat,'หัก ณ ที่จ่าย':v.wht,'สุทธิ':v.net,'ครบกำหนด':v.due,'สถานะ':v.status,'เลขที่ใบเสร็จ':v.rcNo||''}))));
 add('กำไรต่อคัน',js(R.V.map(r=>({'ทะเบียน':r[0],'เที่ยว':r[1],'รายได้':r[2],'ค่าเที่ยวคนขับ':r[3],'ค่าใช้จ่าย':r[4],'กำไร':r[5],'อัตรากำไร':r[6]}))));
 XLSX.writeFile(wb,`รายงานขนส่ง_${month}.xlsx`)}

 const cur=today.slice(0,7),x=D(cur);x.setMonth(x.getMonth()-1);const prev=ymd(x).slice(0,7);

   d.expenses.push({id:uid(),date:ds,driver:v.driver,plate:v.plate,category:'น้ำมัน',amount:Math.round(r.price*.28*n/10)*10,payBy:'บริษัท',memo:'บัตรน้ำมัน',note:''});
   if(Math.random()<.4)d.expenses.push({id:uid(),date:ds,driver:v.driver,plate:v.plate,category:'ทางด่วน',amount:[60,105,160,240][Math.floor(Math.random()*4)],payBy:'คนขับสำรองจ่าย',memo:'',note:`${v.plate} ทางด่วน`})})}
 d.expenses.push({id:uid(),date:prev+'-12',driver:d.drivers[1].name,plate:'70-1234',category:'ยาง',amount:8400,payBy:'บริษัท',memo:'เปลี่ยนยาง 2 เส้น',note:''});
 d.customers.forEach((c,i)=>{const v=makeInvoice(c.name,prev,cur+'-01');if(v&&i===0){v.status='ชำระแล้ว';v.paidDate=cur+'-01';v.rcNo=nextNo('RC',cur+'-01');v.cert=true}});
 return d;
}
